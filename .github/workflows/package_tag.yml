name: Package Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: package-tag-${{ github.ref_name }}
  cancel-in-progress: false

# Optional repository variables for prewarmed release runners:
# - WARP_RELEASE_{LINUX,MACOS,WINDOWS}_RUNNER overrides the hosted runner label.
# - WARP_RELEASE_{LINUX,MACOS,WINDOWS}_SELF_HOSTED=true disables hosted-only setup.
# - WARP_RELEASE_SKIP_TOOL_INSTALL=true skips dependency/tool installation when
#   the selected runner image already provides the release toolchain.

jobs:
  resolve:
    name: Resolve tag inputs
    runs-on: ${{ vars.WARP_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      artifact_tag: ${{ steps.resolve.outputs.artifact_tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      channel: ${{ steps.resolve.outputs.channel }}
      create_release: ${{ steps.resolve.outputs.create_release }}
    steps:
      - name: Checkout tag validation script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve tag, channel, and release mode
        id: resolve
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          tag="${tag#refs/tags/}"
          script/validate_release_tag "$tag"
          if [[ "$tag" =~ \.([A-Za-z]+)_ ]]; then
            channel="${BASH_REMATCH[1]}"
          else
            channel="oss"
          fi
          case "$channel" in
            oss|stable|preview|dev) ;;
            *) channel="oss" ;;
          esac
          create_release="true"

          artifact_tag="$(printf '%s' "$tag" | sed 's#[/\\:*?"<>| ]#-#g')"
          if [[ -z "$tag" ]]; then
            echo "::error::A git tag is required."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact_tag=$artifact_tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "create_release=$create_release" >> "$GITHUB_OUTPUT"

  ensure_release:
    name: Ensure GitHub release exists
    runs-on: ${{ vars.WARP_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    needs: resolve
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Generate release changelog
        if: ${{ needs.resolve.outputs.create_release == 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
          script/generate_release_notes --output release-notes.md

      - name: Create or update GitHub release
        if: ${{ needs.resolve.outputs.create_release == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}

  prepare_release_resources:
    name: Prepare release resources
    runs-on: ${{ vars.WARP_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    needs: [resolve, ensure_release]
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          cache_key: release-resources-linux
          is_self_hosted: ${{ vars.WARP_RELEASE_LINUX_SELF_HOSTED == 'true' }}
          install_release_deps: true
          enable_sccache: true
          skip_tool_install: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
          ssh_key: ${{ secrets.WARP_CHANNEL_CONFIG_ACCESS_SSH_KEY }}

      - name: Validate preinstalled release tools
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for tool in cargo cargo-about protoc; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing preinstalled release tool: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Build common and Windows release resources
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RESOURCES_ROOT: ${{ runner.temp }}/release-resources
          SETTINGS_SCHEMA_CACHE: ${{ runner.temp }}/settings_schema.json
        run: |
          set -euo pipefail

          common_dir="$RESOURCES_ROOT/common"
          windows_dir="$RESOURCES_ROOT/windows"
          archive_dir="$RESOURCES_ROOT/archives"

          GIT_RELEASE_TAG="$RELEASE_TAG" \
            script/prepare_bundled_resources "$common_dir" "$CHANNEL" release-lto

          GIT_RELEASE_TAG="$RELEASE_TAG" \
          INCLUDE_WINDOWS_LICENSES=1 \
            script/prepare_bundled_resources "$windows_dir" "$CHANNEL" release-lto

          mkdir -p "$archive_dir"
          tar -C "$common_dir" -czf "$archive_dir/common.tar.gz" .
          tar -C "$windows_dir" -czf "$archive_dir/windows.tar.gz" .

      - name: Upload common release resources
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-resources-common-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ runner.temp }}/release-resources/archives/common.tar.gz
          if-no-files-found: error

      - name: Upload Windows release resources
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-resources-windows-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ runner.temp }}/release-resources/archives/windows.tar.gz
          if-no-files-found: error

  package_linux:
    name: Package Linux
    runs-on: ${{ vars.WARP_RELEASE_LINUX_RUNNER || 'ubuntu-latest' }}
    needs: [resolve, ensure_release, prepare_release_resources]
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      SETTINGS_SCHEMA_CACHE: ${{ github.workspace }}/.settings_schema_cache.json
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: ${{ vars.WARP_RELEASE_LINUX_SELF_HOSTED == 'true' }}
          install_release_deps: false
          enable_sccache: true
          skip_tool_install: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
          ssh_key: ${{ secrets.WARP_CHANNEL_CONFIG_ACCESS_SSH_KEY }}

      - name: Download common release resources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-resources-common-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ runner.temp }}/release-resource-archive

      - name: Extract common release resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/prepared-bundled-resources"
          mkdir -p "$RUNNER_TEMP/prepared-bundled-resources"
          tar -xzf "$RUNNER_TEMP/release-resource-archive/common.tar.gz" -C "$RUNNER_TEMP/prepared-bundled-resources"

      - name: Install Linux packaging tools
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          missing_packages=()
          if ! command -v fakeroot >/dev/null 2>&1; then
            missing_packages+=(fakeroot)
          fi
          if ! command -v rpmbuild >/dev/null 2>&1 || \
             ! command -v rpm >/dev/null 2>&1 || \
             ! command -v rpmsign >/dev/null 2>&1; then
            missing_packages+=(rpm)
          fi

          if (( ${#missing_packages[@]} > 0 )); then
            sudo apt-get update -y
            sudo apt-get install -y "${missing_packages[@]}"
          fi

          script/linux/install_linuxdeploy

      - name: Validate preinstalled Linux packaging tools
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for tool in dpkg-deb fakeroot linuxdeploy rpm rpmbuild rpmsign; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing preinstalled Linux packaging tool: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Build Linux packages
        id: bundle
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PREPARED_BUNDLED_RESOURCES_DIR: ${{ runner.temp }}/prepared-bundled-resources
        run: |
          script/bundle \
            --channel "$CHANNEL" \
            --release-tag "$RELEASE_TAG" \
            --packages appimage,deb,rpm

      - name: Upload Linux packages as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-packages-${{ needs.resolve.outputs.channel }}-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ steps.bundle.outputs.packages_dir }}/*
          if-no-files-found: error

      - name: Attach Linux packages to GitHub release
        if: ${{ needs.resolve.outputs.create_release == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: ${{ steps.bundle.outputs.packages_dir }}/*
          token: ${{ secrets.GITHUB_TOKEN }}

  package_macos:
    name: Package macOS
    runs-on: ${{ vars.WARP_RELEASE_MACOS_RUNNER || 'macos-26' }}
    needs: [resolve, ensure_release, prepare_release_resources]
    timeout-minutes: 120
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-release
          cache_shared_key: macos-release
          cache_save_if: "false"
          is_self_hosted: ${{ vars.WARP_RELEASE_MACOS_SELF_HOSTED == 'true' }}
          install_release_deps: false
          enable_sccache: true
          skip_tool_install: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
          ssh_key: ${{ secrets.WARP_CHANNEL_CONFIG_ACCESS_SSH_KEY }}

      - name: Download common release resources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-resources-common-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ runner.temp }}/release-resource-archive

      - name: Extract common release resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/prepared-bundled-resources"
          mkdir -p "$RUNNER_TEMP/prepared-bundled-resources"
          tar -xzf "$RUNNER_TEMP/release-resource-archive/common.tar.gz" -C "$RUNNER_TEMP/prepared-bundled-resources"

      - name: Install cargo-bundle
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL != 'true' }}
        run: script/install_cargo_bundle
        shell: bash

      - name: Install create-dmg
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL != 'true' }}
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg
          fi
        shell: bash

      - name: Validate preinstalled macOS packaging tools
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for tool in cargo-bundle create-dmg; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing preinstalled macOS packaging tool: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Show sccache stats before macOS build
        if: ${{ vars.WARP_RELEASE_MACOS_SELF_HOSTED != 'true' && !startsWith(runner.name, 'nsc-runner') }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### sccache before macOS package build"
            echo '```text'
            if command -v sccache >/dev/null 2>&1; then
              sccache --show-stats 2>&1 || true
              sccache --zero-stats 2>&1 || true
            else
              echo "sccache is not installed on this runner."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned macOS package
        id: bundle
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PREPARED_BUNDLED_RESOURCES_DIR: ${{ runner.temp }}/prepared-bundled-resources
        run: |
          set -u

          start_epoch=$(date +%s)
          set +e
          script/bundle \
            --channel "$CHANNEL" \
            --release-tag "$RELEASE_TAG" \
            --nosign \
            --nouniversal
          status=$?
          end_epoch=$(date +%s)
          duration=$((end_epoch - start_epoch))

          echo "bundle_seconds=$duration" >> "$GITHUB_OUTPUT"
          {
            echo "### macOS package timing"
            echo "- bundle_seconds: $duration"
            echo "- status: $status"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Show sccache stats after macOS build
        if: ${{ always() && vars.WARP_RELEASE_MACOS_SELF_HOSTED != 'true' && !startsWith(runner.name, 'nsc-runner') }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### sccache after macOS package build"
            echo '```text'
            if command -v sccache >/dev/null 2>&1; then
              sccache --show-stats 2>&1 || true
            else
              echo "sccache is not installed on this runner."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS package as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-package-${{ needs.resolve.outputs.channel }}-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error

      - name: Attach macOS package to GitHub release
        if: ${{ needs.resolve.outputs.create_release == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: ${{ steps.bundle.outputs.dmg_path }}
          token: ${{ secrets.GITHUB_TOKEN }}

  package_windows:
    name: Package Windows
    runs-on: ${{ vars.WARP_RELEASE_WINDOWS_RUNNER || 'windows-latest' }}
    needs: [resolve, ensure_release, prepare_release_resources]
    timeout-minutes: 150
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          cache_key: windows-x64
          is_self_hosted: ${{ vars.WARP_RELEASE_WINDOWS_SELF_HOSTED == 'true' }}
          install_release_deps: false
          enable_sccache: true
          skip_tool_install: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
          ssh_key: ${{ secrets.WARP_CHANNEL_CONFIG_ACCESS_SSH_KEY }}

      - name: Download Windows release resources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-resources-windows-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ runner.temp }}/release-resource-archive

      - name: Extract Windows release resources
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "prepared-bundled-resources"
          if (Test-Path $destination) {
              Remove-Item -Path $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          tar -xzf (Join-Path $env:RUNNER_TEMP "release-resource-archive/windows.tar.gz") -C $destination

      - name: Install Inno Setup
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL != 'true' }}
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

          $innoSetupPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $innoSetupPath) {
            $innoSetupPath >> $env:GITHUB_PATH
            $env:PATH = "$innoSetupPath;$env:PATH"
          }

          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            throw "ISCC was not found after installing Inno Setup."
          }

      - name: Validate preinstalled Windows packaging tools
        if: ${{ vars.WARP_RELEASE_SKIP_TOOL_INSTALL == 'true' }}
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
              throw "Missing preinstalled Windows packaging tool: ISCC"
          }

      - name: Build unsigned Windows installer
        id: bundle
        shell: pwsh
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PREPARED_BUNDLED_RESOURCES_DIR: ${{ runner.temp }}/prepared-bundled-resources
        run: |
          .\script\windows\bundle.ps1 `
            -CHANNEL "$env:CHANNEL" `
            -RELEASE_TAG "$env:RELEASE_TAG" `
            -ARCH x64

      - name: Upload Windows package as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-package-${{ needs.resolve.outputs.channel }}-${{ needs.resolve.outputs.artifact_tag }}
          path: ${{ steps.bundle.outputs.installer_path }}
          if-no-files-found: error

      - name: Attach Windows package to GitHub release
        if: ${{ needs.resolve.outputs.create_release == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: ${{ steps.bundle.outputs.installer_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
